name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest flake8 black bandit
        # bcrypt 4.x is compatible with passlib; 5.x breaks passlib's CryptContext
        pip install 'bcrypt>=4.0.0,<5.0.0'
    
    - name: Run unit tests
      run: |
        TESTING=1 python3 -m pytest tests/unit/ -q
    
    - name: Run integration tests
      run: |
        TESTING=1 python3 -m pytest tests/integration/ -q

  legacy-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install 'bcrypt>=4.0.0,<5.0.0'
    
    - name: Run legacy CLI tests
      run: |
        TESTING=1 python3 test_kc_share.py -v
        TESTING=1 python3 test_integration.py -v

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black
    
    - name: Lint with flake8
      run: |
        flake8 kubetix-api/main.py kc-share.py --max-line-length=120 --ignore=E501,W503
    
    - name: Check formatting with black
      run: |
        black --check kubetix-api/main.py kc-share.py

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit
    
    - name: Run security scan on kubetix-api
      run: |
        bandit -r kubetix-api/ -ll

  helm-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install Helm
      uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

    - name: Lint Helm chart
      run: |
        helm lint ./charts/kubetix

    - name: Template Helm chart
      run: |
        helm template kubetix-test ./charts/kubetix > /dev/null

name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest flake8 black bandit
    
    - name: Run unit tests
      run: |
        TESTING=1 python3 -m pytest tests/unit/ -q
    
    - name: Run integration tests
      run: |
        TESTING=1 python3 -m pytest tests/integration/ -q

  legacy-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run legacy CLI tests
      run: |
        TESTING=1 python3 test_kc_share.py -v
        TESTING=1 python3 test_integration.py -v

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black
    
    - name: Lint with flake8
      run: |
        flake8 kubetix-api/main.py kc-share.py --max-line-length=120 --ignore=E501,W503
    
    - name: Check formatting with black
      run: |
        black --check kubetix-api/main.py kc-share.py

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit
    
    - name: Run security scan on kubetix-api
      run: |
        bandit -r kubetix-api/ -ll

  helm-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

    - name: Lint Helm chart
      run: |
        helm lint ./charts/kubetix

    - name: Template Helm chart
      run: |
        helm template kubetix-test ./charts/kubetix > /dev/null

  directory-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check for unescaped braces in directory names
      run: |
        # Fail if any directory name contains literal { or } characters
        # These are typically left over from failed brace expansion
        found=$(find . -type d -name '*{*}' -o -type d -name '*}*')
        if [ -n "$found" ]; then
          echo "ERROR: Found directories with unescaped braces:"
          echo "${found}"
          exit 1
        fi

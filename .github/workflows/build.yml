name: Build, Publish & E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the API image. Pushes to GHCR on all events so e2e-tests can pull it.
  # On PRs, only pushes the sha tag (not latest) to avoid polluting the release tag.
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    - name: Log in to GHCR
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push API image (sha tag always, latest only on non-PR)
      id: build
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: kubetix-api
        push: true
        load: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/kubetix-api:${{ github.sha }}
          ${{ github.event_name != 'pull_request' && format('ghcr.io/{0}/kubetix-api:latest', github.repository_owner) || '' }}

  # Runs on PRs and pushes to validate frontend build reproducibility
  # before E2E tests execute against the built image.
  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20'

    - name: Install dependencies (with lockfile validation)
      working-directory: kubetix-web
      run: |
        npm ci

    - name: Build frontend
      working-directory: kubetix-web
      run: |
        npm run build

  # Runs on PRs and pushes after build-and-publish completes.
  # Pulls the image pushed by build-and-publish from GHCR.
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [build-and-publish]
    permissions:
      contents: read
      packages: read

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.14'

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx

    - name: Install Kind (with checksum verification)
      run: |
        curl -fSL --retry 3 --retry-max-time 30 -Lo ./kind-linux-amd64 https://github.com/kubernetes-sigs/kind/releases/download/v0.20.0/kind-linux-amd64
        ACTUAL=$(sha256sum ./kind-linux-amd64 | awk '{print $1}')
        EXPECTED='513a7213d6d3332dd9ef27c24dab35e5ef10a04fa27274fe1c14d8a246493ded'
        if [ "$ACTUAL" != "$EXPECTED" ]; then
          echo "ERROR: Checksum mismatch. Got $ACTUAL, expected $EXPECTED"
          exit 1
        fi
        chmod +x ./kind-linux-amd64
        sudo mv ./kind-linux-amd64 /usr/local/bin/kind

    - name: Install Helm
      uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

    - name: Install kubectl
      uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      with:
        version: 'v1.28.0'

    - name: Log in to GHCR
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Kind cluster
      run: |
        kind create cluster --name kubetix-e2e
        kubectl wait --for=condition=Ready nodes --all --timeout=120s

    - name: Pull and load API image into Kind
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker pull ghcr.io/${{ github.repository_owner }}/kubetix-api:${IMAGE_TAG}
        kind load docker-image ghcr.io/${{ github.repository_owner }}/kubetix-api:${IMAGE_TAG} --name kubetix-e2e

    - name: Set up deployment namespace and secrets
      run: |
        kubectl create namespace kubetix || true
        # Extract kubeconfig for the API pod to use
        kind get kubeconfig --name kubetix-e2e > /tmp/e2e-kubeconfig
        kubectl create secret generic kubetix-kubeconfig \
          --from-file=config=/tmp/e2e-kubeconfig \
          --namespace kubetix --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy with Helm
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        helm upgrade --install kubetix-test ./charts/kubetix \
          --namespace kubetix \
          --set image.repository=ghcr.io/${{ github.repository_owner }}/kubetix-api \
          --set image.tag=$IMAGE_TAG \
          --set image.pullPolicy=IfNotPresent \
          --set env[0].name=KUBECONFIG \
          --set env[0].value=/app/kubeconfig/config \
          --set env[1].name=KUBECONFIG_ENCRYPTION_KEY \
          --set env[1].value=dJWHka3L7pzAe0o2p_ss3FkybzxfEENl8bU-vpdgXvc= \
          --set extraVolumes[0].name=kubeconfig \
          --set extraVolumes[0].secret.secretName=kubetix-kubeconfig \
          --set extraVolumeMounts[0].name=kubeconfig \
          --set extraVolumeMounts[0].mountPath=/app/kubeconfig \
          --set extraVolumeMounts[0].readOnly=true \
          --wait \
          --timeout 5m

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/kubetix-test -n kubetix --timeout=120s

    - name: Port forward API
      run: |
        kubectl port-forward -n kubetix svc/kubetix-test 8000:8000 &
        echo "PORTFORWARD_PID=$!" >> $GITHUB_ENV
        sleep 10

    - name: Run E2E tests
      run: |
        pytest tests/e2e/ -v --tb=short

    - name: Diagnostics
      if: failure()
      run: |
        echo "=== kubectl get all -n kubetix ==="
        kubectl get all -n kubetix -o wide
        echo "=== kubectl get events -n kubetix ==="
        kubectl get events -n kubetix --sort-by=.lastTimestamp
        echo "=== kubectl describe pods -n kubetix ==="
        kubectl describe pods -n kubetix
        echo "=== kubectl logs -n kubetix ==="
        kubectl logs -n kubetix -l app.kubernetes.io/name=kubetix --all-containers --tail=200
        echo "=== helm status ==="
        helm status kubetix-test -n kubetix
        echo "=== helm get manifest ==="
        helm get manifest kubetix-test -n kubetix

    - name: Cleanup
      if: always()
      run: |
        kind delete cluster --name kubetix-e2e --quiet || true

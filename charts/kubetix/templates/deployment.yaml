apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubetix.fullname" . }}
  labels:
    {{- include "kubetix.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kubetix.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $vaultAnnotations := dict "vault.hashicorp.com/agent-inject" "true" "vault.hashicorp.com/role" .Values.externalSecrets.vault.role "vault.hashicorp.com/agent-inject-secret-db-config" (include "kubetix.vaultSecretPath" .) "vault.hashicorp.com/agent-inject-template-encoding-db-config" "json" -}}
      {{- $useVault := and .Values.externalSecrets.enabled .Values.externalSecrets.vault.enabled -}}
      {{- if $useVault }}
      {{- with merge (.Values.podAnnotations | default dict) $vaultAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- else if .Values.podAnnotations }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      labels:
        {{- include "kubetix.selectorLabels" . | nindent 8 }}
        {{- with .Values.customLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kubetix.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubetix.secretName" . }}
                  key: database-url
            - name: KUBETIX_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubetix.secretName" . }}
                  key: secret-key
            - name: KUBECONFIG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubetix.secretName" . }}
                  key: KUBECONFIG_ENCRYPTION_KEY
                  optional: true
            {{- if .Values.database.sqlite.enabled }}
            - name: DATA_DIR
              value: /app/data
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubetix.oidcSecretName" . }}
                  key: client-secret
            - name: OIDC_REDIRECT_URI
              value: {{ .Values.oidc.redirectUri | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.volumeMounts .Values.database.sqlite.enabled .Values.extraVolumeMounts (and .Values.externalSecrets.enabled .Values.externalSecrets.vault.enabled) }}
          volumeMounts:
            {{- if .Values.volumeMounts }}
            {{- toYaml .Values.volumeMounts | nindent 12 }}
            {{- end }}
            {{- if .Values.database.sqlite.enabled }}
            - name: data
              mountPath: /app/data
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
            {{- if and .Values.externalSecrets.enabled .Values.externalSecrets.vault.enabled }}
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or (and .Values.volumes (gt (len .Values.volumes) 0)) .Values.database.sqlite.enabled (and .Values.extraVolumes (gt (len .Values.extraVolumes) 0)) (and .Values.externalSecrets.enabled .Values.externalSecrets.vault.enabled) }}
      volumes:
        {{- if and (and .Values.volumes (gt (len .Values.volumes) 0)) .Values.database.sqlite.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "kubetix.fullname" . }}-data
        {{- toYaml .Values.volumes | nindent 8 }}
        {{- else if .Values.database.sqlite.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "kubetix.fullname" . }}-data
        {{- else if and .Values.volumes (gt (len .Values.volumes) 0) }}
        {{- toYaml .Values.volumes | nindent 8 }}
        {{- end }}
        {{- if .Values.extraVolumes }}
        {{- toYaml .Values.extraVolumes | nindent 8 }}
        {{- end }}
        {{- if and .Values.externalSecrets.enabled .Values.externalSecrets.vault.enabled }}
        - name: vault-secrets
          emptyDir: {}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

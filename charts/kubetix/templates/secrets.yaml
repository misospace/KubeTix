{{- if not .Values.externalSecrets.enabled -}}
{{- if .Values.database.sqlite.enabled -}}
{{- $secretName := include "kubetix.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "kubetix.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: sqlite:////app/data/kubetix.db
  {{- if .Values.secretKey }}
  secret-key: {{ .Values.secretKey | quote }}
  {{- else }}
  {{/*
    IMPORTANT: For production use, set `secretKey` in values.yaml or via
    --set secretKey=<your-base64-encoded-key> on the command line.

    The secret-key is used for JWT signing and must remain stable across
    Helm upgrades. Using randAlphaNum would generate a new key on every
    upgrade, invalidating all existing sessions and tokens.

    For development only: a random key is generated here but will change
    on every helm upgrade. Always provide an explicit secretKey in production.

    Generate one with: openssl rand -base64 32
  */}}
  secret-key: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- if .Values.kubeconfigEncryptionKey.value }}
  KUBECONFIG_ENCRYPTION_KEY: {{ .Values.kubeconfigEncryptionKey.value | quote }}
  {{- else }}
  {{/*
    IMPORTANT: For production use, set `kubeconfigEncryptionKey.value` in values.yaml or via
    --set kubeconfigEncryptionKey.value=<your-fernet-key> on the command line.

    Generate a Fernet key with:
      python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"

    For development only: a known dev key is provided here. It MUST be replaced in production;
    otherwise grant kubeconfigs can be decrypted by anyone with the chart source. Always
    provide an explicit kubeconfigEncryptionKey.value in production.
  */}}
  KUBECONFIG_ENCRYPTION_KEY: "M27nAljv8sE6zMOVJfSTZha1aHgHrPIF3Vk6ZVhcTCk="
  {{- end }}
{{- else if .Values.database.postgresql.enabled -}}
{{- $secretName := include "kubetix.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "kubetix.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.database.postgresql.existingSecret }}
  database-url: {{ include "kubetix.databaseUrl" . }}
  {{- else }}
  database-url: postgresql://{{ .Values.database.postgresql.username }}:{{ .Values.database.postgresql.password }}@{{ .Values.database.postgresql.host }}:{{ .Values.database.postgresql.port }}/{{ .Values.database.postgresql.database }}
  {{- end }}
  {{- if .Values.secretKey }}
  secret-key: {{ .Values.secretKey | quote }}
  {{- else }}
  {{/*
    IMPORTANT: For production use, set `secretKey` in values.yaml or via
    --set secretKey=<your-base64-encoded-key> on the command line.

    The secret-key is used for JWT signing and must remain stable across
    Helm upgrades. Using randAlphaNum would generate a new key on every
    upgrade, invalidating all existing sessions and tokens.

    For development only: a random key is generated here but will change
    on every helm upgrade. Always provide an explicit secretKey in production.

    Generate one with: openssl rand -base64 32
  */}}
  secret-key: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- if .Values.kubeconfigEncryptionKey.value }}
  KUBECONFIG_ENCRYPTION_KEY: {{ .Values.kubeconfigEncryptionKey.value | quote }}
  {{- else }}
  {{/*
    IMPORTANT: For production use, set `kubeconfigEncryptionKey.value` in values.yaml or via
    --set kubeconfigEncryptionKey.value=<your-fernet-key> on the command line.

    Generate a Fernet key with:
      python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"

    For development only: a known dev key is provided here. It MUST be replaced in production;
    otherwise grant kubeconfigs can be decrypted by anyone with the chart source. Always
    provide an explicit kubeconfigEncryptionKey.value in production.
  */}}
  KUBECONFIG_ENCRYPTION_KEY: "M27nAljv8sE6zMOVJfSTZha1aHgHrPIF3Vk6ZVhcTCk="
  {{- end }}
{{- else }}
{{- fail "Please enable either database.sqlite.enabled or database.postgresql.enabled" }}
{{- end }}
{{- end -}}

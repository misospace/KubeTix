apiVersion: v2
name: kubetix
description: A Helm chart for deploying KubeTix - Temporary Kubernetes Access Manager
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  # Bundled PostgreSQL subchart (default). The Helm ``values.yaml`` sets
  # ``database.postgresql.enabled: true``, so ``templates/secrets.yaml``
  # builds ``DATABASE_URL`` from these values out of the box. Disable via
  # ``--set database.postgresql.enabled=false`` to bring your own
  # PostgreSQL instance.
  - name: postgresql
    version: "18.8.10"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: database.postgresql.enabled
    tags:
      - database
      - postgresql
keywords:
  - kubernetes
  - kubeconfig
  - security
  - access
  - temporary
home: https://github.com/misospace/KubeTix
sources:
  - https://github.com/misospace/KubeTix
maintainers:
  - name: Jory Irving
    email: jory@joryirving.com

icon: https://raw.githubusercontent.com/misospace/KubeTix/main/logo.png

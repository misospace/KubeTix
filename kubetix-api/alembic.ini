# Alembic configuration for the KubeTix API.
#
# The database URL is intentionally left blank so that env.py reads it from
# the ``DATABASE_URL`` environment variable at runtime. This keeps credentials
# out of version control and lets the same migration scripts run against
# SQLite (tests), PostgreSQL (Bitnami sub-chart in Helm), or any other engine
# the deployment uses.

[alembic]
script_location = migrations

prepend_sys_path = .
# The ``kubetix_api`` package must be importable so env.py can read
# ``Base.metadata`` from ``kubetix_api.models``. ``.`` resolves to the
# ``kubetix-api/`` directory that ``alembic`` is invoked from.

# sqlalchemy.url is intentionally left blank. env.py injects the value
# from the DATABASE_URL environment variable.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
